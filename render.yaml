# LoveBind API only. The Expo application at repository root is NOT a Node web server.
# Using this Blueprint requires creating or linking a Render Blueprint;
# it does not retroactively update an existing manually configured web service.
services:
  - type: web
    name: lovebind-api
    runtime: node
    repo: https://github.com/IKcracker/LoveBind
    branch: main
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
