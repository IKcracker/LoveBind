name: Synchronize LoveBind lockfiles (temporary)
on:
  push:
    branches:
      - feat/identity-onboarding
    paths:
      - .github/workflows/sync-lockfiles.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve mobile lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve API lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date"
            exit 0
          fi
          git commit -m "chore: commit synchronized Expo and NestJS dependency lockfiles"
          git push origin HEAD:refs/heads/feat/identity-onboarding
