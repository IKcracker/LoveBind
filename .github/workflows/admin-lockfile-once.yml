name: Lock React CRM dependencies (one time)
on:
  push:
    branches: [feat/admin-react-crm]
    paths: ['.github/workflows/admin-lockfile-once.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create deterministic lockfile
        working-directory: admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: lock React CRM dependencies"
          git push origin HEAD:refs/heads/feat/admin-react-crm
