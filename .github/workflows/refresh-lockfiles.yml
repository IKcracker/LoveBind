name: Refresh LoveBind lockfiles (temporary)
on:
  push:
    branches: [feat/discovery-matches-messaging]
    paths: [.github/workflows/refresh-lockfiles.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve Expo lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve API lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore: synchronize LoveBind mobile and API lockfiles"
          git push origin HEAD:refs/heads/feat/discovery-matches-messaging
